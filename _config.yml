title: Echo Extra Echo
description: Echo Extra Echo is an artist-run project in New York
url: ""
baseurl: ""
lang: en
logo: /logo.png
image: /logo.png
author:
  name: Echo Extra Echo
  email: echo.extra.echo@gmail.com

markdown: kramdown
kramdown:
  hard_wrap: true
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exhibitions are a data-only collection (output: false). Each exhibition holds
# its own images (in front matter), and its pages are rendered by the shim files
# under /exhibitions/<slug>/.
collections:
  exhibitions:
    output: false

exclude:
  - Gemfile
  - Gemfile.lock
  - netlify.toml
  - node_modules
  - vendor
  - _to_delete
