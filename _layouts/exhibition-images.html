---
layout: default
---
{% assign ex = site.exhibitions | where: "slug", page.exhibition_slug | first %}
<div class="images-scroll">
  {% for img in ex.images %}
  {% if img.image %}
  <figure class="image-figure">
    <img src="{{ img.image | relative_url }}" alt="{{ img.caption }}">
    {% if img.caption %}
    <figcaption><span class="caption-body">{{ img.caption }}</span></figcaption>
    {% endif %}
  </figure>
  {% endif %}
  {% endfor %}
</div>
