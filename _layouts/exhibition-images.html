---
layout: default
---
<div class="images-scroll">
  {% assign ex_images = site.images | where: "exhibition", page.exhibition_slug | sort: "order" %}
  {% for img in ex_images %}
  {% if img.image %}
  <figure class="image-figure">
    <img src="{{ img.image | relative_url }}" alt="{{ img.title }}">
    {% if img.caption %}
    <figcaption><span class="caption-body">{{ img.caption }}</span></figcaption>
    {% endif %}
  </figure>
  {% endif %}
  {% endfor %}
</div>
