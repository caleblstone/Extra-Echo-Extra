backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://echo-extra-echo.netlify.app
display_url: https://echo-extra-echo.netlify.app

collections:
  - name: "exhibitions"
    label: "Exhibitions"
    label_singular: "Exhibition"
    folder: "_exhibitions"
    create: true
    identifier_field: "slug"
    slug: "{{slug}}"
    extension: "md"
    summary: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL id, e.g. evil-rat. Lowercase, hyphens, no spaces. Must match the file name." }
      - { label: "Order", name: "order", widget: "number", value_type: "int", hint: "Lower numbers appear first in the exhibitions list." }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Presents Line", name: "presents", widget: "string", required: false, default: "Echo Extra Echo presents" }
      - { label: "Artists", name: "artists", widget: "string", required: false }
      - { label: "Dates", name: "dates", widget: "string", required: false }
      - { label: "Hours", name: "hours", widget: "string", required: false }
      - { label: "Opening", name: "opening", widget: "string", required: false }
      - { label: "Contact", name: "contact", widget: "text", required: false }
      - { label: "Flyer Image", name: "flyer", widget: "image", required: false }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        label_singular: "Image"
        summary: "{{fields.caption}}"
        hint: "Add the images for this exhibition. Drag to reorder — this is the order they appear in the scroll."
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "text", required: false }
      - { label: "Text (essay)", name: "body", widget: "markdown", required: false }

  - name: "pages"
    label: "Pages"
    files:
      - label: "Home / About"
        name: "home"
        file: "index.md"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "default" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/" }
          - { label: "Page Title", name: "title", widget: "hidden", default: "" }
          - { label: "Body Class", name: "body_class", widget: "hidden", default: "about-page" }
          - { label: "Show exhibition list", name: "exhibition_list", widget: "hidden", default: true }
          - { label: "About text", name: "body", widget: "markdown" }
